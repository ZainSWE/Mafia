<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mafia</title>
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/title-screen.css">
</head>
<body>
    <div class="background">
        <video autoplay loop muted playsinline>
            <source src="videos/title-screen/background.mp4" type="video/mp4">
            Your browser does not support the video tag
        </video>
    </div>
    <header>
        <h1>MAFIA</h1>
        <h3><a href="home.html" id="startLink">click to start</a></h3>
    </header>
    
    <audio id="title-screen-audio" loop>
        <source src="audio/title-screen.mp3" type="audio/mpeg">
    </audio>
    
    <script>
        // Play audio on user interaction
        const audio = document.getElementById('title-screen-audio');
        const startLink = document.getElementById('startLink');
        
        // Attempt autoplay
        audio.play().catch(() => {
            // If autoplay fails, play on first click anywhere
            document.body.addEventListener('click', () => {
                audio.play();
            }, { once: true });
        });
    </script>
</body>
</html>
